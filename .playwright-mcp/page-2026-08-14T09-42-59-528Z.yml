              - paragraph [ref=f3e460]: Factory training and Ford diagnostic equipment, covering gas, hybrid, and electric models.
            - generic [ref=f3e469]:
              - heading "Genuine Ford and Motorcraft parts" [level=3] [ref=f3e470]
              - paragraph [ref=f3e471]: Parts matched to your vehicle, and a parts counter that can order what is not on the shelf.
