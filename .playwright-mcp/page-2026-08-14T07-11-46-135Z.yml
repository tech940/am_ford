          - paragraph [ref=f1e188]: Written by the team at AM Ford about this specific 2025 F-150, not the model in general.
        - generic [ref=f1e190]:
          - paragraph [ref=f1e191]: Platinum sits at the top of the F-150 range, so this one already carries the equipment most buyers otherwise add a piece at a time. Heated and cooled front seats, a 360 degree camera that earns its keep in a tight yard or backing to a trailer, and BlueCruise for hands-free highway miles. Pro Power Onboard turns the bed into a generator on a job site or during an outage. Four-wheel drive, delivery miles only.
