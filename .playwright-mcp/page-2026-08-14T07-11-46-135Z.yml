    - generic [ref=f1e199]:
      - generic [ref=f1e200]:
        - generic [ref=f1e201]: About This F-150
        - heading "What it's like to own this truck." [level=2] [ref=f1e202]
        - generic [ref=f1e203]:
          - paragraph [ref=f1e207]:
            - text: Priced
            - strong [ref=f1e208]: $3,425 below original MSRP
          - paragraph [ref=f1e213]:
