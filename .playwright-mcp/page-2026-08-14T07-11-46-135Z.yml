          - paragraph [ref=f1e226]: Price, odometer, condition, and equipment, straight off this vehicle's own record. If a number matters to your decision, it should come from here rather than from a brochure for the F-150 range.
          - link "Ask about this F-150 on (440) 998-2151" [ref=f1e227] [cursor=pointer]:
