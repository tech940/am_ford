    - generic [ref=e418]:
      - paragraph [ref=e419]: How this page works
      - heading "How to shop this lot" [level=2] [ref=e420]
      - paragraph [ref=e421]: "AM Ford lists 6 vehicles today, and this page shows up to 9 of them at a time. That is short enough to read end to end before you narrow anything down, and reading it first is worth the few minutes. On a national listing site, filters exist to cut an unreadable list into a readable one. On a lot this size they do something more useful: each control answers one question about vehicles you can already see all of, so you can use them to test an idea rather than to survive the volume."
      - paragraph [ref=e422]:
        - text: Every vehicle here is a Ford, and the split is 5 new alongside 1 certified pre-owned. Listed prices run from $36,450 to $71,990, across model years 2025
        - generic [ref=e423]: and 2024
        - text: . No filter or link on this page leads to a search this lot cannot answer, so wherever a control exists, there is at least one vehicle standing behind it.
      - heading "What the filters actually mean here" [level=3] [ref=e424]
      - generic [ref=e425]:
        - generic [ref=e426]:
          - term [ref=e427]: Body style
          - definition [ref=e428]:
            - text: The lot holds 1 truck
            - generic [ref=e429]: ", 3 SUVs"
            - generic [ref=e430]: ", 1 car"
            - generic [ref=e431]: ", and 1 electric Ford"
            - text: ". Body style is the fastest first cut because it tracks how a vehicle is used rather than how it is badged: an open bed carries loads you would not want inside the cabin, a closed cargo area keeps the weather off, and a car sits lower and turns in sharper than either. Go straight to the"
            - link "Ford trucks in stock" [ref=e433] [cursor=pointer]:
              - /url: /inventory?type=Truck
            - generic [ref=e434]:
              - text: ","
              - link "Ford SUVs in stock" [ref=e435] [cursor=pointer]:
                - /url: /inventory?type=SUV
            - generic [ref=e436]:
              - text: ","
              - link "Ford cars in stock" [ref=e437] [cursor=pointer]:
                - /url: /inventory?type=Car
            - generic [ref=e438]:
              - text: ", and"
              - link "Ford EVs in stock" [ref=e439] [cursor=pointer]:
                - /url: /inventory?type=EV
            - text: .
        - generic [ref=e440]:
          - term [ref=e441]: Drivetrain
          - definition [ref=e442]:
            - text: Currently 3 four-wheel drive
            - generic [ref=e443]: ", 2 all-wheel drive"
            - generic [ref=e444]: ", and 1 rear-wheel drive"
            - text: . From November through March this is the filter that earns its keep here. Four-wheel drive is selected when traction runs out and is the usual answer for a vehicle that has to pull out of a soft field or an unplowed drive. All-wheel drive works without being asked for it, which suits road driving in lake-effect snow. Rear-wheel drive, today the Mustang, is workable here year round provided you budget for a winter tire set. Drivetrain sits in the filter drawer rather than in the link lists, because it narrows the list without changing what kind of vehicle you are shopping for.
        - generic [ref=e445]:
          - term [ref=e446]: Fuel
          - definition [ref=e447]:
            - text: Today that is 4 gas
            - generic [ref=e448]: ", 1 hybrid"
            - generic [ref=e449]: ", and 1 electric"
            - text: . Gas is the simplest to live with because you refuel wherever you already stop. A
            - link "hybrid Ford" [ref=e450] [cursor=pointer]:
              - /url: /inventory?fuel=Hybrid
            - text: is charged by its own engine and by braking rather than by a plug, so the benefit lands in the stop and start driving around town rather than on the highway run to Cleveland or Erie. An
            - link "electric Ford" [ref=e451] [cursor=pointer]:
              - /url: /inventory?fuel=Electric
            - text: is charged where you park, so the question to settle before you buy is less about range than about whether a charger can go where you sleep. Ask us about that before you commit rather than after. If you are weighing one against the other, read
            - link "the F-150 compared with the F-150 Lightning" [ref=e452] [cursor=pointer]:
              - /url: /compare/f-150-vs-f-150-lightning
            - text: and
            - link "the Explorer compared with the Escape" [ref=e453] [cursor=pointer]:
              - /url: /compare/explorer-vs-escape
            - text: ". One thing worth knowing before you click both: the EV body style and the electric fuel filter are separate controls that return the same vehicle on today's lot, so either one gets you there."
        - generic [ref=e454]:
          - term [ref=e455]: Price
          - definition [ref=e456]:
            - text: Listed prices span $36,450 to $71,990, and the price shortcuts on this site are cut from that real spread rather than from round numbers, so each band has stock behind it. The slider filters the listed price of the vehicle. It knows nothing about your trade, your down payment, sales tax, or title fees, which is why the figure you finance is worked out with the finance team and not on this page. No rate and no monthly payment is published anywhere on this site, because the terms depend on the lender and on your application rather than on the car. To turn a listed price into a real number, you can
            - link "start a Ford finance application" [ref=e457] [cursor=pointer]:
              - /url: /financing
            - text: ","
            - link "have your current vehicle appraised" [ref=e458] [cursor=pointer]:
              - /url: /trade-in
            - text: ", or read"
            - link "how financing works when your credit needs rebuilding" [ref=e459] [cursor=pointer]:
              - /url: /finance/bad-credit
            - text: .
        - generic [ref=e460]:
          - term [ref=e461]: Mileage
          - definition [ref=e462]: Odometer readings across the lot run from 6 to 8,420 miles. The mileage slider is the quickest way to separate delivery miles from real use. The 5 new vehicles here read 22 miles or fewer, which is transport and lot movement rather than driving.
      - heading "What the condition labels mean" [level=3] [ref=e463]
      - generic [ref=e464]:
        - generic [ref=e465]:
          - term [ref=e466]: New (5 of 6)
          - definition [ref=e467]:
            - text: You are the first name on the title, the equipment is whatever the current model year carries, and the odometer reads delivery miles rather than someone else's commute.
            - link "Browse the new Fords in stock" [ref=e468] [cursor=pointer]:
              - /url: /inventory?condition=New
            - text: .
        - generic [ref=e469]:
          - term [ref=e470]: Certified Pre-Owned (1 of 6)
          - definition [ref=e471]:
            - text: Certification is the entire difference between a certified pre-owned Ford and an ordinary second-hand car. Ford, not the dealership, decides which vehicles are eligible, defines the inspection a technician has to complete, and requires the vehicle history to be reviewed before anything can be listed as certified. What the coverage includes is set by that program and documented for the individual vehicle, so ask us for the paperwork on the exact unit you are considering and read it before you sign. We do not print a figure or a term for it on this page, because the document that governs it travels with the car.
            - link "Browse the certified pre-owned Fords in stock" [ref=e472] [cursor=pointer]:
              - /url: /inventory?condition=Certified+Pre-Owned
            - text: .
        - generic [ref=e473]:
          - term [ref=e474]: Used (none on the lot)
          - definition [ref=e475]:
            - text: There is no used option in the condition filter, and that is not an oversight. The lot holds no used vehicles at all right now, so a used search here would hand you an empty page. Everything listed is new or certified pre-owned. If an ordinary used Ford is specifically what you are after,
            - link "tell us what you are looking for" [ref=e476] [cursor=pointer]:
              - /url: /contact
            - text: and we will be straight with you about whether we have it.
      - heading "What happens after you enquire" [level=3] [ref=e477]
      - paragraph [ref=e478]: Every form and every phone number on this page reaches the same sales team at 1059 State Route 46 North, Jefferson, OH 44047. There is one AM Ford and no branch network, so nobody hands you sideways to another store.
      - generic [ref=e479]:
        - generic [ref=e480]:
          - term [ref=e481]: If you asked about a specific vehicle
          - definition [ref=e482]: We confirm it is still standing here, because a lot this size changes faster than a page can, and we send the stock number and the VIN for that exact unit so you can run your own history check instead of taking ours on trust.
        - generic [ref=e483]:
          - term [ref=e484]: If you have something to trade
          - definition [ref=e485]:
            - text: Send photographs and the mileage and we appraise it against current market data without you driving in first. Any make, not only Fords.
            - link "Start a trade appraisal" [ref=e486] [cursor=pointer]:
              - /url: /trade-in
            - text: .
        - generic [ref=e487]:
          - term [ref=e488]: If you applied for financing
          - definition [ref=e489]:
            - text: The application goes to the finance team, who come back with the terms a lender will write for you. Nothing is approved on this page, and no number is quoted before an application exists, which is why you will not find a rate anywhere on this site.
            - link "Apply for Ford financing" [ref=e490] [cursor=pointer]:
              - /url: /financing
            - text: .
        - generic [ref=e491]:
          - term [ref=e492]: If you are not local
          - definition [ref=e493]:
            - text: Free home delivery within 300 miles and vehicle shipping available to all 50 states. The credit application, the trade appraisal, and the paperwork can all be completed without a showroom visit, which is the point of that offer rather than a footnote to it.
            - link "How delivery and shipping work" [ref=e494] [cursor=pointer]:
              - /url: /nationwide-vehicle-delivery
            - text: .
        - generic [ref=e495]:
          - term [ref=e496]: After you take it home
          - definition [ref=e497]:
            - text: Service, parts, and recall work happen at the same address you bought it from.
            - link "Book service at the Jefferson shop" [ref=e498] [cursor=pointer]:
              - /url: /service
            - text: .
