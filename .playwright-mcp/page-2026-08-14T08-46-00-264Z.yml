            - generic [ref=e706]: AM Ford stocks new Ford trucks, SUVs, cars, and EVs alongside certified pre-owned Ford models at 1059 State Route 46 North, Jefferson, OH 44047. We serve Ashtabula County, Saybrook, Geneva, Mentor, and Erie, PA.
          - generic [ref=e709]:
            - button "What is the difference between a used Ford and a Certified Pre-Owned (CPO) Ford?" [ref=e710]
            - generic: A Certified Pre-Owned Ford passes a Ford-authorized multi-point inspection and comes with manufacturer-backed limited warranty coverage, roadside assistance, and a CARFAX vehicle history report. A standard used vehicle carries no factory certification.
          - generic [ref=e718]:
            - button "Can I apply for financing at AM Ford with less than perfect credit?" [ref=e719]
            - generic: Yes. AM Ford works with Ohio credit unions and national lenders to find auto loan options across a wide range of credit profiles, including first-time buyers. Apply online and our finance team will follow up with your terms.
          - generic [ref=e727]:
            - button "Can I trade in my current vehicle at AM Ford in Jefferson?" [ref=e728]
            - generic: Yes. AM Ford appraises trade-ins of any make or model using current market data, and your trade equity can be applied directly to any vehicle in our inventory.
          - generic [ref=e736]:
            - button "Does AM Ford offer nationwide or home vehicle delivery?" [ref=e737]
            - generic: Yes. AM Ford offers nationwide vehicle delivery and home delivery across Northeast Ohio and Ashtabula County. We handle documentation remotely and coordinate shipping directly to your driveway or workplace.
          - generic [ref=e745]:
            - button "What warranties come with new Ford vehicles at AM Ford?" [ref=e746]
            - generic: Every new Ford includes Ford's factory 3-year/36,000-mile Bumper-to-Bumper Limited Warranty and a 5-year/60,000-mile Powertrain Limited Warranty, along with 24/7 Ford Roadside Assistance.
          - generic [ref=e754]:
            - button "Can I order a custom Ford vehicle directly from the factory?" [ref=e755]
            - generic: Yes. If the exact trim, color, or package you want is not on our lot, AM Ford can place a factory custom order directly with Ford Motor Company or source it through our regional dealer network.
          - generic [ref=e763]:
            - button "How does test drive booking work at AM Ford?" [ref=e764]
            - generic: You can schedule a test drive online or by calling (440) 998-2151. We will have the vehicle prepped, cleaned, and waiting out front for your arrival.
          - generic [ref=e772]:
            - button "Are there any hidden dealer documentation or add-on fees at AM Ford?" [ref=e773]
            - generic: No. AM Ford practices straightforward, transparent pricing. The price quoted is the price you pay plus state tax and title fees; we do not add unexpected dealer prep or doc fees at signing.
          - generic [ref=e781]:
            - button "What maintenance services does the AM Ford Service Center handle?" [ref=e782]
            - generic: Our certified Ford Service Center handles oil changes, tire rotations, brake service, battery replacement, transmission service, and major recall work using genuine OEM Ford and Motorcraft parts.
